# Parámetros del estudio. Todo valor que afecte un resultado vive aquí y queda versionado.

uit:            # Valor de la UIT por año (S/). Tope de inclusión = 8 UIT.
  2023: 4950
  2024: 5150
  2025: 5350

periodo:
  desde: "2023-01"
  hasta: "2025-12"

# Tramo en que el PTE no publica el código de finalidad ni el estado real de la orden
# (diagnóstico S1). Restricción R-05.
tramo_sin_codigo_ni_estado:
  desde: "2024-08"
  hasta: "2025-03"

# Prefijos de RUC que corresponden a personas naturales (se seudonimizan, RNF-07).
# 10 = persona natural con DNI; 15 y 17 = personas naturales con otro documento.
ruc_persona_natural: ["10", "15", "17"]

llm:
  proveedor: groq                 # groq | cerebras | deepinfra | openai  (no cambiar entre lotes)
  modelo: openai/gpt-oss-120b     # en cerebras el id es gpt-oss-120b
  temperatura: 0
  semilla: 20251231
  esfuerzo_razonamiento: low      # gpt-oss: low | medium | high
  max_tokens_salida: 2048         # incluye los tokens de razonamiento
  max_pasos: 6                    # llamadas a herramientas/SQL por pregunta (igual en C1, C2 y C3)
  # Precio de lista (US$ por millón de tokens) para el indicador de costo por consulta.
  # Fuente: https://console.groq.com/docs/models (consultado 2026-10-27).
  precio_entrada_usd_mtok: 0.15
  precio_salida_usd_mtok: 0.60

sql:
  timeout_ms: 5000
  max_filas: 500
  esquemas_permitidos: ["datos"]

mef:
  # Unidad ejecutora de la Municipalidad Distrital de Uchumayo en el SIAF (columna SEC_EJEC).
  sec_ejec: "300354"
  archivos:              # CSV de datos abiertos del MEF ya filtrados (scripts/filtrar_mef.py)
    2023: data/raw/mef/filtrado/2023-Gasto_UCHUMAYO.csv
    2024: data/raw/mef/filtrado/2024-Gasto_UCHUMAYO.csv
    2025: data/raw/mef/filtrado/2025-Gasto-Mensual_UCHUMAYO.csv
